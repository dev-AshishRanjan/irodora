name: CI

# This workflow MIRRORS .harness/verification/gates.json, in order.
#
# The mirror is machine-checked twice over:
#
#   1. scripts/verify-state.mjs fails if an active gate has no step here. It compares whole
#      `run:` commands — NOT substrings. It used to use a substring test, and `pnpm test` is
#      a substring of `pnpm test:golden`, `pnpm test:e2e` and six more, so deleting the real
#      `pnpm test` step left the check green.
#   2. scripts/verify-gate-mirror.mjs removes each active gate's step from this file in turn
#      and asserts gate 0 fails naming that gate. A check nobody has watched fail is not a
#      check — that script is what caught the defect above.
#
# ONE JOB, IN ORDER. Steps run sequentially and GitHub stops at the first failure, which is
# what "every active gate in gates.json order, stopping at the first failure" (F-004) means.
# The cost is real and worth naming: a failing typecheck means the secret scan does not run
# on that push. The mitigation is that gate 15 also runs on every pull request, and a secret
# is caught before merge rather than after.
#
# NO STEP IN THIS FILE CARRIES AN `if:`, and that is a decision rather than a coincidence.
# Guarding a pending gate's step on `hashFiles(...)` reads like it activates the moment the
# feature lands; what it actually does is let an ACTIVE gate sit in this file and never run,
# because gate 0 compares `run:` commands. Gate 11 nearly shipped skipped for the whole of R1
# that way, and gate 12 carried the same guard until F-038 removed it. A gate that is not ready
# has NO step here and is recorded as `ciStep: false` in gates.json, so the omission is
# declared and machine-checked rather than hidden behind an expression (F-072).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by release.yml, so a release runs THIS job rather than a copy of it. A second
  # gate list is exactly the drift ADR-0024 exists to prevent, and it would be invisible:
  # both files would look correct, and the release would be gated by whichever was edited
  # last. Gate 0's mirror check reads this file, so the gates a release runs are the gates
  # that are declared.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned, not `latest`. A scanner that changes under you turns a clean run into a noisy one
  # on a commit that touched nothing, and the version is what makes a result reproducible.
  GITLEAKS_VERSION: '8.30.1'

jobs:
  gates:
    name: Verification gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the diff

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # ---- gate 0: state -------------------------------------------------
      # Runs first, always, with no dependencies. It is the only gate that is
      # meaningful before any application code exists.
      - name: 'Gate 0 — state'
        run: node scripts/verify-state.mjs

      # Not a gate, but the proof that gate 0's CI-mirror check can fail. It mutates
      # ci.yml in place and restores it; on a runner that is a throwaway checkout.
      - name: 'Gate 0 — mirror proof'
        run: node scripts/verify-gate-mirror.mjs

      - name: 'Gate 0 — stale-rationale proof'
        run: node scripts/verify-stale-rationale-proof.mjs

      # Not a gate — the proof that gate 0's duplicate effect-id check can fail (F-102). The
      # check was watched failing against the real collision (E-032 held by two links, twenty-
      # four minutes apart), but that evidence expired with the renumber, so case 1 here
      # RECONSTRUCTS it and is the regression test. Four cases: three red, and a CONTROL that
      # must stay GREEN — a link added with a fresh id — because a check that failed on any
      # added link would otherwise pass. Plants into effects.json and restores it byte-for-byte.
      - name: 'Gate 0 — duplicate effect-id proof'
        run: node scripts/verify-effect-id-proof.mjs

      # Not a gate — the proof that gate 0's id-uniqueness TABLE can fail (F-106). F-102 built
      # that check for effects.json alone and the same hole was found in feature_list.json and
      # gates.json within the hour, so it became a table over seven spaces. A table has a
      # failure mode a single check does not: a space it cannot locate and silently skips.
      # Seven cases — three duplicates, two fail-closed (renamed array, absent file) and two
      # controls that must stay GREEN. The two halves are independent: neutering the duplicate
      # check leaves the fail-closed cases passing and vice versa.
      - name: 'Gate 0 — state id-uniqueness proof'
        run: node scripts/verify-state-id-proof.mjs

      # Not a gate — the proof that gate 0's lockfile check can fail (F-098). It runs HERE,
      # before `pnpm install`, because that is the whole point of the check it proves: the
      # install step already refuses a stale lockfile, and refusing it at step nine skips
      # every gate after it while naming one package and no cause. Plants five drifts and two
      # controls; both controls must stay GREEN, one of them a workspace project that declares
      # nothing — `tests/bench: {}` is that shape, and reading it as absent would have made the
      # check fail on a correct lockfile from its first run.
      - name: 'Gate 0 — lockfile drift proof'
        run: node scripts/verify-lockfile-proof.mjs

      # Belongs to gate 8, run here with the other proofs. It plants IN MEMORY — nothing is
      # written to the working tree — so it needs no checkout hygiene of its own.
      - name: 'Gate 8 — token-reach proof'
        run: node scripts/verify-token-reach.mjs --prove

      # ---- toolchain (activates with F-001) ------------------------------
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      # ---- gates 1-6: code ------------------------------------------------
      - name: 'Gate 1 — typecheck'
        run: pnpm typecheck

      - name: 'Gate 2 — lint'
        run: pnpm lint

      # Not a gate — the proof that the claims lint inside gate 2 can fail (NFR-21, F-025).
      # Plants each banned construction into a real scanned path and asserts the lint goes red
      # AND names the right one, with the baseline asserted green either side. TWO cases must
      # stay GREEN: a `claims-ok:` marker carrying a reason, and the clean fixture — because a
      # proof where everything is red cannot distinguish a working gate from one that fails on
      # everything.
      - name: 'Gate 2 — claims mutation proof'
        run: node scripts/verify-claims-proof.mjs

      - name: 'Gate 3 — format'
        run: pnpm format:check

      - name: 'Gate 4 — test'
        run: pnpm test

      - name: 'Gate 5 — color-golden'
        run: pnpm test:golden

      - name: 'Gate 6 — build'
        run: pnpm build

      # NOT A GATE, and F-114's third criterion is that this says so. Gate 16 reads the built
      # APK and is the only thing that catches a dependency shipping a permission (E-049); it
      # runs in release.yml because there is no APK on a pull request, which makes the delay
      # between introducing a permission and hearing about it a TAG.
      #
      # `pnpm build` above runs `expo prebuild`, which writes the Android manifest — so what
      # app.config.ts and its plugins contribute is readable HERE, on the pull request, with no
      # Gradle and no JDK. It cannot see what library manifests merge in, and it prints the
      # three permissions it is blind to on every run.
      #
      # Ordered after gate 6 deliberately: an absent manifest fails rather than passing with
      # nothing to read.
      - name: 'Gate 2 — permission set (config half)'
        run: pnpm verify:permissions

      - name: 'Gate 2 — permission-set proof'
        run: pnpm verify:permissions:prove

      # NOT A GATE. A worklet may only call other worklets: the Worklets babel plugin captures
      # an unmarked function as an ordinary JS-thread one, and invoking it from the frame thread
      # throws the moment a frame arrives. F-115's crash was exactly that, and NOTHING ELSE HERE
      # CAN SEE IT — jest has one runtime, typecheck sees an ordinary call, lint sees an import
      # that resolves, and the directive changes no JS-thread behaviour, so the tests pass
      # identically either side of the bug (E-050).
      #
      # It proves the SOURCE says so, not that Babel emitted it, and it prints the calls it
      # cannot resolve on every run.
      - name: 'Gate 2 — worklet reachability'
        run: pnpm verify:worklets

      # The two halves of F-159: insets read in one place, and no layout constant larger
      # than the narrowest supported screen. Both shipped broken for weeks with every gate green.
      - name: 'Gate 2 — viewport proof'
        run: pnpm verify:viewport:prove

      - name: 'Gate 2 — worklet reachability proof'
        run: pnpm verify:worklets:prove

      # ---- gates 7-11: surfaces and content -------------------------------

      # Gate 8 runs the scope reporter FIRST — a suite that passes over a component
      # nobody registered proves nothing about that component, and `test:a11y` exited
      # 0 over zero test files until F-017 gave it subjects and a refusal.
      #
      # `verify-token-reach.mjs` is the same question one level down (F-092): the conformance
      # suite proves the components it renders conform, and says nothing about a design token
      # nothing renders. Both reporters run before the suite, for the same reason.
      - name: 'Gate 8 — a11y'
        run: pnpm test:a11y

      # Not a gate — the proof that the spacing check inside gate 8 can fail (F-095, ADR-0074).
      # Unlike the token-reach proof above it PLANTS IN THE WORKING TREE, so it restores in a
      # `finally` and verifies the restore; on a runner that is a throwaway checkout anyway.
      # Three cases red, TWO GREEN — a comment discussing an off-scale number, and a value that
      # is a step of the scale — because a check that fired on prose gets deleted, and the real
      # protection goes with it. Plus two cases the exit code alone would miss: an exemption
      # that matches nothing, and a step removed from the MANIFEST, which is what distinguishes
      # reading the scale from carrying a copy of it.
      - name: 'Gate 8 — spacing-scale proof'
        run: pnpm verify:spacing:prove

      # Belongs to gate 2, run here with the other proofs. Seven cases, and the interesting
      # ones are the LOWERED values rather than the missing one: 24 and 25 both have to be
      # rejected, because widening device support is a plausible, well-meant edit and it is
      # what silently removes the Lens. Two more reject a plugin that hard-codes the number
      # instead of passing the constant — INCLUDING when the literal is the right value —
      # because two numbers that can disagree is the shape this regresses in. The real config
      # must stay GREEN, which is the half that stops it being a check that fails on
      # everything. Plants in memory only; nothing is written to the working tree.
      - name: 'Gate 2 — Android minimum proof'
        run: pnpm verify:minsdk:prove

      # Gate 7 (e2e) has NO STEP HERE, deliberately, and gates.json records it as
      # status:pending + ciStep:false so the mirror check knows the omission is intentional.
      #
      # The API surface it used to run went with the server tier (ADR-0051); the app surface
      # arrives with F-039. Nothing declares `test:e2e` in between, and scripts/e2e-scope.mjs
      # exits non-zero on that rather than reporting an empty set as coverage.
      #
      # Withdrawing the step is the honest option. Keeping it behind `if: hashFiles(...)` is
      # the F-072 hazard: the mirror check compares `run:` commands and does not read `if:`,
      # so the gate would read as covered in CI while never once running. Both flags flip back
      # together with F-039.

      # Unconditional. The `if:` this replaced was guarding on a build output, which means
      # the gate would silently skip rather than fail if the build had not produced it — a
      # gate that cannot run is failing open, and this one is blocking.
      - name: 'Gate 9 — contrast'
        run: pnpm test:contrast

      - name: 'Gate 9 — contrast mutation proof'
        run: node scripts/verify-contrast-proof.mjs

      - name: 'Gate 10 — cvd'
        run: pnpm test:cvd

      # Unconditional, and that is the point. The `if: hashFiles('content/colors') != ''` this
      # replaced would have skipped the gate for the whole of R1, because F-011 ships the gate
      # and F-012 ships the entries — the gate would have been "active" in gates.json and never
      # once run in CI. Gate 0's mirror check compares `run:` commands and does not read `if:`,
      # so nothing would have said so. A gate that cannot run is failing open, and this one is
      # blocking.
      #
      # It is safe to run with an empty corpus because it does not depend on one: it exercises
      # 1 valid and 18 invalid fixture corpora on every invocation, and FAILS if it cannot find
      # them. See the gate's own output, which prints the authored-entry count beside the
      # fixture count so a green run cannot be mistaken for coverage.
      - name: 'Gate 11 — content'
        run: pnpm test:content

      # Not a gate — the proof that gate 11 can fail. Mutates the VALID fixture corpus 19 ways
      # and asserts the gate goes red and names the right field, with the baseline asserted
      # green either side. One case must stay GREEN (a reformat), because a proof where
      # everything is red cannot distinguish a working gate from one that fails on everything.
      - name: 'Gate 11 — content mutation proof'
        run: node scripts/verify-content-proof.mjs

      # ---- gates 12-14: release -------------------------------------------

      # Unconditional as of F-038. This step carried
      # `if: github.event_name == 'push' && hashFiles('tests/bench/package.json') != ''`, and
      # `tests/bench/package.json` has existed since F-001 — so the surviving effect of the
      # guard was to skip the gate on every pull request, which is where a slow change is
      # actually reviewed. Flipping the gate to `active` with the guard in place was watched
      # failing gate 0 before the line came off.
      #
      # What this measures and what it does not is printed on every run: the engine's own cost
      # against committed ceilings, and NFR-4's on-device budgets reported NOT RUN, because a
      # CI runner is not the slowest device in the support matrix.
      - name: 'Gate 12 — perf'
        run: pnpm bench

      # Not a gate — the proof that gate 12 can fail. A performance gate is the easiest kind to
      # ship broken, because broken looks identical to healthy: green, fast, reporting numbers.
      # Nine cases go red, including a percentile hardcoded to satisfy its own known answers.
      # ONE must stay GREEN: a device budget with a 0.001 ms ceiling, unreachable by anything —
      # if this gate were ever changed to satisfy NFR-4's device budgets with a desktop number,
      # that is the case that would catch it.
      - name: 'Gate 12 — bench discrimination proof'
        run: pnpm bench:prove

      # ---- gate 15: security ----------------------------------------------
      # gitleaks is installed and then invoked through `pnpm security:secrets` — the SAME
      # command a developer runs locally. Using gitleaks-action here instead would mean CI
      # and a workstation scan different things with the same name, and the gate command in
      # gates.json would describe neither.
      #
      # A finding ROTATES the secret. It never earns an allowlist entry: a secret in git
      # history is compromised regardless of whether the commit was pushed, and removing it
      # only makes it harder to find later.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # ONE step, because gate 15's command is now one command. The two halves used to be
      # two steps, and only the first was mirrored against gates.json — the audit step could
      # have been deleted with every gate still reading as covered, which is F-078's defect
      # in a different directory.
      #
      # High and Critical block; moderate and low are reported. That bar has not moved. What
      # changed (F-079) is that a blocking advisory with NO FIXED VERSION can be accepted with
      # a written reachability argument, a named owner and an expiry, rather than leaving the
      # gate permanently red — which is how a security gate stops being read.
      - name: 'Gate 15 — security'
        run: pnpm security

      # Not a gate — the proof that the no-inference scan inside gate 15 can fail (NFR-22,
      # F-037). It plants a function that infers a protected characteristic into a REAL
      # non-exempt source file, asserts the scan goes red AND names it, and restores in a
      # `finally` — the discipline F-100 paid for.
      #
      # IT LIVES IN GATE 15 RATHER THAN GATE 2 FOR A MECHANICAL REASON: the scan reads the
      # prohibited vocabulary from the BUILT @irodora/store, so there is one definition rather
      # than a copy in a script (E-013) — and gate 2 runs before gate 6 builds anything. It
      # belongs beside the key-material scan anyway: both are about what the product must never
      # do with personal data.
      #
      # TWO cases must stay GREEN: a doc comment discussing the vocabulary, which this
      # repository is full of, and identifiers containing "age" and "race". A check that fired
      # on either would be switched off within a day, and the real protection would go with it.
      - name: 'Gate 15 — no-inference mutation proof'
        run: node scripts/verify-no-inference-proof.mjs

      # Not a gate — the proof that the disposition cannot become a blanket exemption. A
      # DIFFERENT high advisory must still stop the build while an accepted one is in force,
      # and an accepted entry must expire by itself and fail when it goes stale.
      - name: 'Gate 15 — advisory disposition proof'
        run: node scripts/verify-audit.mjs --prove
