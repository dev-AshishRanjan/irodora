name: CI

# This workflow MIRRORS .harness/verification/gates.json, in order.
#
# The mirror is machine-checked twice over:
#
#   1. scripts/verify-state.mjs fails if an active gate has no step here. It compares whole
#      `run:` commands — NOT substrings. It used to use a substring test, and `pnpm test` is
#      a substring of `pnpm test:golden`, `pnpm test:e2e` and six more, so deleting the real
#      `pnpm test` step left the check green.
#   2. scripts/verify-gate-mirror.mjs removes each active gate's step from this file in turn
#      and asserts gate 0 fails naming that gate. A check nobody has watched fail is not a
#      check — that script is what caught the defect above.
#
# ONE JOB, IN ORDER. Steps run sequentially and GitHub stops at the first failure, which is
# what "every active gate in gates.json order, stopping at the first failure" (F-004) means.
# The cost is real and worth naming: a failing typecheck means the secret scan does not run
# on that push. The mitigation is that gate 15 also runs on every pull request, and a secret
# is caught before merge rather than after.
#
# Steps for gates that are still `pending` are present but guarded by a file existence check,
# so they activate the moment their feature lands rather than waiting for someone to remember.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned, not `latest`. A scanner that changes under you turns a clean run into a noisy one
  # on a commit that touched nothing, and the version is what makes a result reproducible.
  GITLEAKS_VERSION: '8.30.1'

jobs:
  gates:
    name: Verification gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the diff

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # ---- gate 0: state -------------------------------------------------
      # Runs first, always, with no dependencies. It is the only gate that is
      # meaningful before any application code exists.
      - name: 'Gate 0 — state'
        run: node scripts/verify-state.mjs

      # Not a gate, but the proof that gate 0's CI-mirror check can fail. It mutates
      # ci.yml in place and restores it; on a runner that is a throwaway checkout.
      - name: 'Gate 0 — mirror proof'
        run: node scripts/verify-gate-mirror.mjs

      # The compose file's portability across Coolify and Dokploy. Static, so it runs
      # here rather than needing a VPS — the deployment itself is an attested obligation
      # (ADR-0038), but "uses nothing a platform rejects" is checkable on every commit.
      - name: 'Compose portability'
        if: hashFiles('infra/compose/docker-compose.prod.yml') != ''
        run: node scripts/verify-compose-portability.mjs

      # ---- toolchain (activates with F-001) ------------------------------
      - name: Set up pnpm
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@v4

      - name: Install
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile

      # ---- gates 1-6: code ------------------------------------------------
      - name: 'Gate 1 — typecheck'
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm typecheck

      - name: 'Gate 2 — lint'
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm lint

      - name: 'Gate 3 — format'
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm format:check

      - name: 'Gate 4 — test'
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm test

      - name: 'Gate 5 — color-golden'
        if: hashFiles('packages/color-spaces/package.json') != ''
        run: pnpm test:golden

      - name: 'Gate 6 — build'
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm build

      # ---- gates 7-11: surfaces and content -------------------------------
      # Gate 8 (a11y) is asserted INSIDE the web Playwright run, so it has no
      # step of its own. gates.json records that as ciStep:false and the mirror
      # check knows the omission is deliberate.
      - name: Install Playwright browsers
        if: hashFiles('apps/web/package.json') != ''
        run: pnpm exec playwright install --with-deps chromium

      - name: 'Gate 7 — e2e (includes gate 8, a11y)'
        if: hashFiles('apps/web/package.json') != ''
        run: pnpm test:e2e

      # Unconditional. The `if:` this replaced was guarding on a build output, which means
      # the gate would silently skip rather than fail if the build had not produced it — a
      # gate that cannot run is failing open, and this one is blocking.
      - name: 'Gate 9 — contrast'
        run: pnpm test:contrast

      - name: 'Gate 9 — contrast mutation proof'
        run: node scripts/verify-contrast-proof.mjs

      - name: 'Gate 10 — cvd'
        if: hashFiles('packages/cvd-engine/dist') != ''
        run: pnpm test:cvd

      - name: 'Gate 11 — content'
        if: hashFiles('content/colors') != ''
        run: pnpm test:content

      # ---- gates 12-14: release -------------------------------------------
      - name: 'Gate 12 — perf'
        if: github.event_name == 'push' && hashFiles('tests/bench/package.json') != ''
        run: pnpm bench

      - name: 'Gate 13 — web-perf'
        if: github.event_name == 'push' && hashFiles('tests/web-perf/package.json') != ''
        run: pnpm test:perf

      - name: 'Gate 14 — e2e-full'
        if: github.event_name == 'push' && hashFiles('tests/e2e-full/package.json') != ''
        run: pnpm test:e2e:full

      # ---- gate 15: security ----------------------------------------------
      # gitleaks is installed and then invoked through `pnpm security:secrets` — the SAME
      # command a developer runs locally. Using gitleaks-action here instead would mean CI
      # and a workstation scan different things with the same name, and the gate command in
      # gates.json would describe neither.
      #
      # A finding ROTATES the secret. It never earns an allowlist entry: a secret in git
      # history is compromised regardless of whether the commit was pushed, and removing it
      # only makes it harder to find later.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: 'Gate 15 — security (secrets)'
        run: pnpm security:secrets

      - name: 'Gate 15 — security (dependency audit)'
        if: hashFiles('pnpm-lock.yaml') != ''
        # --audit-level high blocks on High AND Critical. Moderate and below are reported by
        # the scheduled audit rather than blocking a pull request on a transitive advisory
        # nobody can action today.
        run: pnpm audit --audit-level high
