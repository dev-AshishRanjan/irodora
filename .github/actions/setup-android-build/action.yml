name: 'Set up an Android build'
description: >-
  Node, pnpm, workspace install, a JDK and the Android SDK components this project pins.
  One definition, used by both the on-demand build lane and the release lane, so the two
  cannot drift into building against different toolchains.

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: Set up pnpm
      uses: pnpm/action-setup@v4

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile

    # WITHOUT THIS THE BUNDLE CANNOT BE BUILT, and the failure looks nothing like its cause.
    #
    # The app imports ten workspace packages, every one of which declares `main` and `exports`
    # pointing at `dist/`. `dist/` is generated, gitignored, and produced by `pnpm build` —
    # not by `pnpm install`. Without it Metro resolves `@irodora/ui`'s package.json fine, then
    # fails on the `main` it names, and reports it as an *invalid package.json configuration*
    # in a workspace package rather than as a missing build step.
    #
    # `release.yml` runs `pnpm build` too, in its `gates` job — on a DIFFERENT RUNNER. Jobs do
    # not share a filesystem, so that build never reaches the one doing the bundling. Putting
    # it in the shared setup is what makes both lanes correct at once.
    - name: Build the workspace packages
      shell: bash
      run: pnpm build

    # AGP 8.12 (pinned by react-native 0.86's version catalog) requires JDK 17 or newer.
    # 17 rather than 21: it is what the React Native and Expo toolchains are tested against,
    # and a newer JDK is where Gradle plugin incompatibilities show up first.
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up the Android SDK
      uses: android-actions/setup-android@v3

    # Explicit rather than left to AGP's auto-download. AGP will fetch a missing platform,
    # but the failure when it cannot is a Gradle stack trace about a licence — and the
    # versions come from react-native/gradle/libs.versions.toml, so naming them here means a
    # React Native upgrade that moves compileSdk fails visibly instead of silently building
    # against whatever the runner image happened to ship.
    #
    # The NDK is installed because `ndkVersion` is set on the root project. React Native
    # ships prebuilt native libraries, so it may well be unnecessary; it stays until a green
    # run without it proves that, because a missing NDK fails late and slowly.
    - name: Install the pinned SDK components
      shell: bash
      run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
