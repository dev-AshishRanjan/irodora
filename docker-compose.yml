# ---------------------------------------------------------------------------
# Irodora — local development backing services.
#
# This file starts ONLY the infrastructure the applications depend on. The
# applications themselves run from your workstation (`pnpm dev`) so you keep
# fast reload and a real debugger.
#
# The full-stack compose file that Coolify and Dokploy consume lives at
# infra/compose/docker-compose.prod.yml and lands with feature F-005.
# See docs/operations/deployment/local.md
# ---------------------------------------------------------------------------

name: irodora-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: irodora
      POSTGRES_PASSWORD: irodora
      POSTGRES_DB: irodora
      # Deterministic collation. Text ordering affects colour-name search
      # results, and a locale difference between a workstation and CI would
      # make search assertions flaky for reasons nobody would guess.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U irodora -d irodora']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  valkey:
    # Valkey is the BSD-licensed Redis fork; protocol-compatible with the
    # Redis clients we use, without the SSPL licensing question.
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - '6379:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # S3-compatible object storage. The same adapter serves MinIO here,
    # Garage or MinIO on a VPS, and S3 in the cloud profile — which is the
    # whole point of putting blob storage behind a port.
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: irodora
      MINIO_ROOT_PASSWORD: irodora-local-dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    # Catches every outbound email in development. Nothing leaves the machine.
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  valkey-data:
  minio-data:
