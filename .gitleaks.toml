title = "Irodora secret scanning configuration"

# Start from the upstream rule set, then narrow the allowlist. We never widen
# a rule to make a scan pass: a finding is either a real secret (rotate it) or
# a genuine false positive that earns a NARROW, path-scoped exemption here.
[extend]
useDefault = true

[allowlist]
description = "Paths and patterns that cannot contain live credentials"

paths = [
  '''\.gitleaks\.toml$''',
  '''pnpm-lock\.yaml$''',
  # Example env files are required to contain placeholder-shaped values.
  '''\.env\.example$''',
  '''.*\.tfvars\.example$''',
  # Documentation shows credential SHAPES so operators recognise them.
  '''^docs/.*\.md$''',
  '''^\.harness/.*\.md$''',
  # The environment-contract tests. This file's entire purpose is to feed
  # secret-SHAPED values through the loader and assert they are never echoed —
  # so it necessarily contains strings that look like credentials.
  #
  # Added 2026-08-14 (F-005) after gate 15 flagged two fixtures as generic API
  # keys. They were invented for the test, not real, and the fixtures have since
  # been rewritten to use the placeholder vocabulary above — but the original
  # values are in commit ae56dd1 and gitleaks scans history.
  #
  # THE COST, stated rather than discovered later: a real secret pasted into
  # this one file would not be caught. That is why the exemption is a single
  # file and not `.*\.test\.ts$`.
  '''^packages/config/src/load\.test\.ts$''',
]

regexes = [
  # Documented placeholders. These are the only placeholder forms allowed in
  # the repository — any other high-entropy string is treated as a real secret.
  '''(?i)(replace-me|changeme|example|placeholder|your-[a-z-]+-here|xxxxxxxx)''',
  '''postgres://irodora:irodora@localhost''',
  # "Valkey" ends in "key", so a phrase like `Valkey, S3-compatible storage` reads to the
  # generic-api-key rule as key = "S3-compatible". Scoped to that exact product term rather
  # than to a path, so a real credential in the same file is still caught. Added 2026-08-14
  # (F-005); the phrase now lives in commit 1a9ceb2f's history even though the working tree
  # was reworded.
  '''^S3-compatible$''',
  # An idempotency-key fixture. `api-contract.md` §2 documents the header as `<uuid>`, so the
  # test uses one — and `const KEY = '<uuid>'` is exactly the shape generic-api-key looks for.
  #
  # There is NO SECRET HERE TO ROTATE: the value was invented for the test, names nothing, and
  # opens nothing. This is the false-positive path the header of this file describes, not the
  # leak path — a real finding is rotated and never allowlisted.
  #
  # Added 2026-08-19 (F-015 increment 4's value, commit c67be7f). Scoped to the exact literal
  # rather than to the file, so a real credential pasted into `idempotency.test.ts` is still
  # caught. THE COST: this one string can never again indicate a leak, which is acceptable
  # because it cannot be one.
  '''^0f9a3c1e-7b2d-4c6a-9e18-5d0b7c2a4f31$''',
]

# Colour hex values and OKLCH triples are high-entropy by nature and appear in
# enormous volume in this repository. They are not credentials.
[[rules]]
id = "irodora-colour-literal-not-a-secret"
description = "Colour literals are product data, not secrets"
regex = '''#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})\b'''
[rules.allowlist]
regexTarget = "match"
regexes = ['''.*''']
